name: Scanner checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU inference and export dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test comparison, export and OCR boundaries
        run: python -m unittest discover -s tests -v
      - name: Run the documented JSON example
        run: python main.py --from-json examples/recognized_pages.json --output outputs/ci-example
      - name: Rebuild and verify the demo preview
        run: |
          python scripts/build_demo.py
          git diff --exit-code -- docs/demo.md
      - name: Check CLI help
        run: python main.py --help
